<div class="path-container">
  <header class="path-header">
    <button routerLink="/dashboard" class="btn-back" type="button" aria-label="Volver al dashboard">←</button>
    <h1>Mi Camino</h1>
  </header>

  <div class="units-list" *ngIf="units$ | async as units; else loading">
    <div class="unit-row" *ngFor="let unit of units; let i = index">
      <article
        class="unit-node"
        [ngClass]="unit.status"
        [class.open]="isUnitOpen(unit.id)"
        [class.is-even]="i % 2 === 1"
      >
        <button
          type="button"
          class="unit-summary"
          [attr.aria-expanded]="isUnitOpen(unit.id)"
          [attr.aria-controls]="'unit-panel-' + unit.id"
          (click)="toggleUnit(unit.id)"
        >
          <span class="unit-icon" aria-hidden="true">{{ unit.icon || '📘' }}</span>

          <span class="unit-copy">
            <span class="unit-title">{{ unit.title }}</span>
            <span class="unit-meta">{{ unit.description || 'Nivel general' }}</span>
            <span class="status-text">{{ statusLabel(unit.status) }}</span>
          </span>

          <span class="unit-chevron" aria-hidden="true">{{ isUnitOpen(unit.id) ? '⌃' : '›' }}</span>
        </button>

        <div class="unit-panel" [id]="'unit-panel-' + unit.id" [hidden]="!isUnitOpen(unit.id)">
          <div class="unit-panel__content">
            @if (unit.status === 'available') {
              @if (unit.vocabularyIds?.length) {
                <button
                  type="button"
                  class="action-btn action-btn--vocabulary"
                  [routerLink]="['/vocabulary', unit.id]"
                  (click)="$event.stopPropagation()"
                >
                  📚 Vocabulario
                </button>
              }
              <button
                type="button"
                class="action-btn action-btn--start"
                [routerLink]="['/lesson', unit.id]"
                (click)="$event.stopPropagation()"
              >
                ▶ Empezar
              </button>
            }

            @if (unit.status === 'completed') {
              @if (unit.vocabularyIds?.length) {
                <button
                  type="button"
                  class="action-btn action-btn--vocabulary"
                  [routerLink]="['/vocabulary', unit.id]"
                  (click)="$event.stopPropagation()"
                >
                  📚 Vocabulario
                </button>
              }
              <button
                type="button"
                class="action-btn action-btn--repeat"
                [routerLink]="['/lesson', unit.id]"
                (click)="$event.stopPropagation()"
              >
                ↻ Repetir
              </button>
            }
          </div>
        </div>
      </article>
    </div>
  </div>
</div>

<ng-template #loading>
  <app-loading-spinner></app-loading-spinner>
</ng-template>
